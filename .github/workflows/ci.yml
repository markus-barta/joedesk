name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - name: Rebuild contracts, incident fixtures and time vectors
        run: npm run test:contracts
      - name: Board UI modules (health, history continuity, formatting, host gate)
        run: npm run test:ui
      - name: Server contract tests (disposable tmpfs container)
        run: |
          docker run --rm --network none --tmpfs /var/lib/joe-board \
            -v "$PWD:/repo:ro" -w /repo node:22 \
            node --test test/server-contract.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb
      - name: Board UI gate (390/1024/1440, light and dark, P1 fixtures, privacy)
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          JOED_QA_DIR: ${{ runner.temp }}/joedesk-qa/p3
        run: node scripts/browser-p3.mjs
      - name: Keep the screenshots for the visual check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joedesk-p3-screenshots
          path: ${{ runner.temp }}/joedesk-qa/p3

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t joedesk:ci .
