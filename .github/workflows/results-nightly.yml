name: results-nightly

# JOED-192: push, PR and dispatch runs check Results fully in Europe/Vienna and
# as subsets in UTC and America/New_York. This nightly run keeps the full
# 3-timezone Results suite. GitHub runs schedules from the default branch only.
on:
  schedule:
    # 23:00 UTC = 00:00 Europe/Vienna (CET) or 01:00 (CEST). With the 95-minute
    # timeout the worst case ends 00:35 UTC, clear of the 02:10-04:45 UTC agm2
    # quiet window (HNET-433), the only recurring agm2 constraint.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    # Never on a GitHub-hosted runner: without the agm2 opt-in the job is skipped.
    if: vars.JOEDESK_AGM2 == 'on'
    runs-on: ${{ (vars.JOEDESK_AGM2 == 'on' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","agm2"]') || 'ubuntu-latest' }}
    # Up to 60 min lock wait + ~25 min for three full zones + setup/upload.
    timeout-minutes: 95
    steps:
      # The agm2 hold flag pauses heavy work (HNET-433 quiet window). DEVOPS
      # mirrors it for runner users (AGM-303): /run/agm-hold/HOLD-ALL present
      # = held (its first line is the reason, possibly empty); /run/agm-hold/SYNCED
      # holds one UTC ISO-8601 line (Z or +00:00), refreshed every 10 s after each successful
      # sync. HELD unless SYNCED is younger than 30 s (mtime and content) and
      # HOLD-ALL is absent. Held by HOLD-ALL skips green; an unconfirmed hold
      # state (stale/missing/garbled SYNCED) fails red so a stuck mirror is loud.
      - name: Respect the agm2 hold (HOLD-ALL)
        id: hold
        env:
          HOLD_DIR: /run/agm-hold
        run: |
          hold="$HOLD_DIR/HOLD-ALL" synced="$HOLD_DIR/SYNCED"
          skip_held() {
            # The reason follows a fixed prefix, so it cannot start a workflow command.
            reason=$(head -n 1 "$hold" 2>/dev/null | head -c 200 | tr -cd '[:print:]')
            echo "::notice::skipped: quiet window (HOLD-ALL is set; reason: ${reason:-none})"
            printf 'skipped: quiet window (HOLD-ALL is set; reason: %s)\n' "${reason:-none}" >> "$GITHUB_STEP_SUMMARY"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          }
          unconfirmed() {
            echo "::error::agm2 hold state not confirmed ($1); treating it as held and not running."
            exit 1
          }
          if [ -e "$hold" ]; then skip_held; fi
          [ -f "$synced" ] || unconfirmed "$synced missing"
          now=$(date -u +%s)
          mtime=$(stat -c %Y "$synced" 2>/dev/null) || unconfirmed "cannot stat $synced"
          # The whole file must be exactly one UTC ISO-8601 line (Z or +00:00),
          # optionally newline-terminated; anything else is unconfirmed.
          [ "$(stat -c %s "$synced" 2>/dev/null || echo 999)" -le 64 ] || unconfirmed "SYNCED is not one UTC ISO-8601 line"
          stamp=$(cat "$synced" 2>/dev/null; printf x) || unconfirmed "cannot read $synced"
          stamp=${stamp%x}; stamp=${stamp%$'\n'}
          case "$stamp" in *$'\n'*|*$'\r'*) unconfirmed "SYNCED is not one UTC ISO-8601 line" ;; esac
          [[ "$stamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+00:00)$ ]] || unconfirmed "SYNCED is not one UTC ISO-8601 line"
          written=$(date -u -d "$stamp" +%s 2>/dev/null) || unconfirmed "SYNCED time unreadable"
          for age in $((now - mtime)) $((now - written)); do
            if [ "$age" -lt -5 ] || [ "$age" -ge 30 ]; then unconfirmed "SYNCED is ${age}s old"; fi
          done
          # Re-check: HOLD-ALL may have been set while SYNCED was read.
          if [ -e "$hold" ]; then skip_held; fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"
      - name: Keep temporary files under RUNNER_TEMP
        if: steps.hold.outputs.skip == 'false'
        run: |
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\nNPM_CONFIG_CACHE=%s/npm-cache\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.hold.outputs.skip == 'false'
        with:
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.hold.outputs.skip == 'false'
        with:
          node-version: "22"
      - name: Resolve browser path
        if: steps.hold.outputs.skip == 'false'
        run: |
          if [ -n "${BROWSER_PATH:-}" ] && [ -x "$BROWSER_PATH" ]; then
            browser_path=$BROWSER_PATH
          elif ! browser_path=$(command -v chromium || command -v chromium-browser || command -v google-chrome); then
            echo '::error::No browser found on the self-hosted runner; install chromium, chromium-browser or google-chrome.'
            exit 1
          fi
          printf 'BROWSER_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Full Results gate in UTC, Europe/Vienna and America/New_York (browser host lock)
        if: steps.hold.outputs.skip == 'false'
        shell: bash scripts/with-browser-lock.sh {0}
        env:
          JOED_QA_ROOT: ${{ runner.temp }}/joedesk-qa
        run: |
          JOED_QA_DIR="$JOED_QA_ROOT/p4" npm run test:results -- UTC Europe/Vienna America/New_York
      - name: Keep the nightly Results screenshots
        if: always() && steps.hold.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: joedesk-results-nightly-screenshots
          path: ${{ runner.temp }}/joedesk-qa/p4
